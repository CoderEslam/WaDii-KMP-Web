<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaDii — Auto Spare Parts Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito Sans', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        // ===== Neumorphism design tokens (see SKILL.md) =====
                        // All resolve via CSS custom properties, so light/dark switching
                        // needs no separate dark: classes — see the :root / html.dark block below.
                        //
                        // Module-spelling -> class cheatsheet (SKILL.md's modules use slightly
                        // different token names for the same concept; don't invent duplicates):
                        //   neutral-primary-soft / neutral-primary   -> bg-surface
                        //   neutral-secondary-soft                   -> bg-surface-secondary
                        //   neutral-secondary-medium                 -> bg-surface-secondary-medium
                        //   neutral-tertiary-soft / neutral-tertiary -> bg-surface-tertiary
                        //   neutral-tertiary-medium                  -> bg-surface-tertiary-medium
                        //   neutral-quaternary                       -> bg-surface-quaternary
                        //   neutral-primary-medium (tooltip light)   -> bg-surface-primary-medium
                        //   border-success / border-danger / border-brand (solid) -> already
                        //     auto-generated since success/danger/brand are registered colors.
                        surface: 'var(--surface)',
                        'surface-secondary': 'var(--surface-secondary)',
                        'surface-secondary-medium': 'var(--surface-secondary-medium)',
                        'surface-primary-medium': 'var(--surface-primary-medium)',
                        'surface-tertiary': 'var(--surface-tertiary)',
                        'surface-tertiary-medium': 'var(--surface-tertiary-medium)',
                        'surface-quaternary': 'var(--surface-quaternary)',

                        heading: 'var(--heading)',
                        body: 'var(--body)',
                        'body-subtle': 'var(--body-subtle)',

                        brand: 'var(--brand)',
                        'brand-soft': 'var(--brand-soft)',
                        'brand-softer': 'var(--brand-softer)',
                        'fg-brand': 'var(--fg-brand)',
                        'fg-brand-strong': 'var(--fg-brand-strong)',

                        secondary: 'var(--secondary)',
                        'secondary-soft': 'var(--secondary-soft)',

                        'fg-disabled': 'var(--fg-disabled)',
                        disabled: 'var(--bg-disabled)',
                        'toggle-thumb': 'var(--white)',

                        // Named without a redundant "border-" prefix so the generated
                        // Tailwind utility reads as border-default / border-brand-subtle
                        // / border-success-subtle etc. (matching SKILL.md's own token
                        // names) instead of border-border-default.
                        default: 'var(--border-default)',
                        'default-medium': 'var(--border-default-medium)',
                        'default-strong': 'var(--border-default-strong)',
                        light: 'var(--border-light)',
                        'light-medium': 'var(--border-light-medium)',
                        buffer: 'var(--border-buffer)',
                        'brand-subtle': 'var(--border-brand-subtle)',

                        success: 'var(--success)',
                        'success-soft': 'var(--success-soft)',
                        'success-medium': 'var(--success-medium)',
                        'success-subtle': 'var(--border-success-subtle)',
                        'fg-success': 'var(--fg-success)',
                        'fg-success-strong': 'var(--fg-success-strong)',

                        danger: 'var(--danger)',
                        'danger-soft': 'var(--danger-soft)',
                        'danger-medium': 'var(--danger-medium)',
                        'danger-subtle': 'var(--border-danger-subtle)',
                        'fg-danger': 'var(--fg-danger)',
                        'fg-danger-strong': 'var(--fg-danger-strong)',

                        warning: 'var(--warning)',
                        'warning-soft': 'var(--warning-soft)',
                        'warning-medium': 'var(--warning-medium)',
                        'warning-subtle': 'var(--border-warning-subtle)',
                        'fg-warning': 'var(--fg-warning)',

                        dark: 'var(--dark)',
                        'dark-strong': 'var(--dark-strong)',
                    },
                    boxShadow: {
                        // Namespaced so the existing Tailwind shadow-sm/md/lg/xl/2xl scale
                        // (still used by un-migrated screens) is left completely alone.
                        'neu-2xs': 'var(--shadow-2xs)',
                        'neu-xs': 'var(--shadow-xs)',
                        'neu-sm': 'var(--shadow-sm)',
                        'neu-md': 'var(--shadow-md)',
                        'neu-lg': 'var(--shadow-lg)',
                        'neu-xl': 'var(--shadow-xl)',
                        'neu-2xl': 'var(--shadow-2xl)',
                        'neu-inset': 'var(--shadow-inset)',
                    },
                    borderRadius: {
                        // Namespaced so rounded-lg/xl/2xl/3xl (still used by un-migrated
                        // screens) keep their current Tailwind-default values.
                        'neu-sm': '2px',
                        'neu-default': '6px',
                        'neu-base': '8px',
                    }
                }
            }
        };
        // Apply dark class immediately to avoid flash
        (function() {
            if (localStorage.getItem('darkMode') === 'true') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <style>
        /* ===== BASE ===== */
        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        /* =====================================================================
           NEUMORPHISM DESIGN TOKENS
           Values taken directly from SKILL.md's colors.md/shadows.md where a
           table is given (surface, heading, body, body-subtle, fg-disabled,
           brand, secondary, and all shadow tokens). Every other token below
           (surface-secondary/tertiary/quaternary steps, border-*, brand-soft/
           softer, success/danger/warning palettes, dark/dark-strong) is left
           agnostic by SKILL.md ("you choose how to implement the styles"), so
           these are authored choices, not spec values. `dark` / `dark-strong` /
           `white` are intentionally constant across themes (always-dark chips
           like dark tooltips, stacked-avatar counters, dark badges).
           ===================================================================== */
        :root {
            --surface: #EEF0F1;
            --surface-secondary: #E6E9EA;
            --surface-secondary-medium: #E1E5E6;
            --surface-primary-medium: #E9ECED;
            --surface-tertiary: #DDE1E3;
            --surface-tertiary-medium: #D4D9DC;
            --surface-quaternary: #CBD1D5;

            --heading: #2B2E33;
            --body: #4A4F57;
            --body-subtle: #6B7280;
            --fg-disabled: #9CA3AF;
            --bg-disabled: var(--surface-secondary);

            --brand: #E8590C;
            --brand-soft: #FBDCC4;
            --brand-softer: #FDEEE2;
            --fg-brand: #E8590C;
            --fg-brand-strong: #B8440A;
            --border-brand: #E8590C;
            --border-brand-subtle: #F0A876;

            --secondary: #52697E;
            --secondary-soft: #E1E7EB;

            --border-default: #D6DADD;
            --border-default-medium: #C7CDD1;
            --border-default-strong: #AEB6BC;
            --border-light: #E4E7E9;
            --border-light-medium: #DADEE1;
            --border-buffer: var(--surface);

            --success: #1F9D55;
            --success-soft: #E1F5E9;
            --success-medium: #C3ECD3;
            --border-success-subtle: #9EDBB7;
            --fg-success: #1F9D55;
            --fg-success-strong: #167A42;

            --danger: #D92D2D;
            --danger-soft: #FBE7E7;
            --danger-medium: #F6C6C6;
            --border-danger-subtle: #F0A8A8;
            --fg-danger: #D92D2D;
            --fg-danger-strong: #B71C1C;

            --warning: #B36B00;
            --warning-soft: #FDF0DA;
            --warning-medium: #FBDFB0;
            --border-warning-subtle: #F0C27D;
            --fg-warning: #B36B00;

            --dark: #2B2E33;
            --dark-strong: #1D1F23;
            --white: #FFFFFF;

            /* Dual-directional shadow pairs — light-mode neutrals per shadows.md */
            --shadow-2xs: 1px 1px 2px #b8b9be, -1px -1px 2px #ffffff;
            --shadow-xs: 2px 2px 4px #b8b9be, -2px -2px 4px #ffffff;
            --shadow-sm: 3px 3px 6px #b8b9be, -3px -3px 6px #ffffff;
            --shadow-md: 6px 6px 12px #b8b9be, -6px -6px 12px #ffffff;
            --shadow-lg: 8px 8px 16px #b8b9be, -8px -8px 16px #ffffff;
            --shadow-xl: 10px 10px 20px #b8b9be, -10px -10px 20px #ffffff;
            --shadow-2xl: 12px 12px 24px #b8b9be, -12px -12px 24px #ffffff;
            --shadow-inset: inset 2px 2px 5px #b8b9be, inset -3px -3px 7px #ffffff;
        }

        html.dark {
            --surface: #23262B;
            --surface-secondary: #292C32;
            --surface-secondary-medium: #2C2F35;
            --surface-primary-medium: #26292F;
            --surface-tertiary: #32363D;
            --surface-tertiary-medium: #383C44;
            --surface-quaternary: #3E434B;

            --heading: #ECEEF0;
            --body: #9AA0A8;
            --body-subtle: #9AA0A8;
            --fg-disabled: #6B7280;
            --bg-disabled: var(--surface-secondary);

            --brand: #FF7A2E;
            --brand-soft: #3A2314;
            --brand-softer: #2E1C10;
            --fg-brand: #FF7A2E;
            --fg-brand-strong: #FF9955;
            --border-brand: #FF7A2E;
            --border-brand-subtle: #8A4A1E;

            --secondary: #7C93A8;
            --secondary-soft: #223038;

            --border-default: #313640;
            --border-default-medium: #3A3F4A;
            --border-default-strong: #474D59;
            --border-light: #292D34;
            --border-light-medium: #2F343B;
            --border-buffer: var(--surface);

            --success: #2FBE72;
            --success-soft: #163A26;
            --success-medium: #1F4E33;
            --border-success-subtle: #2C6B44;
            --fg-success: #2FBE72;
            --fg-success-strong: #4ED88C;

            --danger: #F0605F;
            --danger-soft: #3A2020;
            --danger-medium: #4E2626;
            --border-danger-subtle: #6B3232;
            --fg-danger: #F0605F;
            --fg-danger-strong: #FF8A89;

            --warning: #F0A63C;
            --warning-soft: #3A2E14;
            --warning-medium: #4E3C1A;
            --border-warning-subtle: #6B5424;
            --fg-warning: #F0A63C;

            /* Dual-directional shadow pairs — dark neutrals derived from the
               dark surface (#23262B) instead of #b8b9be/#ffffff, per shadows.md */
            --shadow-2xs: 1px 1px 2px #191b1f, -1px -1px 2px #2c2f36;
            --shadow-xs: 2px 2px 4px #191b1f, -2px -2px 4px #2c2f36;
            --shadow-sm: 3px 3px 6px #191b1f, -3px -3px 6px #2c2f36;
            --shadow-md: 6px 6px 12px #191b1f, -6px -6px 12px #2c2f36;
            --shadow-lg: 8px 8px 16px #191b1f, -8px -8px 16px #2c2f36;
            --shadow-xl: 10px 10px 20px #191b1f, -10px -10px 20px #2c2f36;
            --shadow-2xl: 12px 12px 24px #191b1f, -12px -12px 24px #2c2f36;
            --shadow-inset: inset 2px 2px 5px #191b1f, inset -3px -3px 7px #2c2f36;
        }

        body {
            margin: 0;
            font-family: 'Nunito Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: var(--surface);
            color: var(--body);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== ROOT Z-INDEX ===== */
        #root { position: relative; z-index: 1; }

        /* ===== MODAL BACKDROP DARK ===== */
        html.dark .bg-black\/50 { background: rgba(0,5,25,.75) !important; backdrop-filter: blur(4px); }

        /* ===== TOAST ===== */
        .toast-enter { animation: slideIn .35s cubic-bezier(.34,1.56,.64,1); }

        /* ===== DARK: LOADING SPINNER ===== */
        html.dark .border-t-transparent { border-top-color: transparent !important; }

        /* ===== SIDEBAR / HEADER / NAV — neumorphic shell chrome =====
           Flat surface, no blur/translucency; the sidebar is separated from
           content by a hairline border only (per sidebars.md, shadows are
           optional for the sidebar container itself). */
        .space-sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border-default);
        }
        .space-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border-default);
        }

        /* Brand wordmark — solid brand color, no gradient (structural elements
           don't get decorative gradients under neumorphism). */
        .brand-text {
            color: var(--brand);
        }

        /* ===== GLOBAL TRANSITIONS ===== */
        body, aside, header, nav, main, input, textarea, select, button {
            transition: background-color .3s ease, border-color .3s ease, color .25s ease, box-shadow .3s ease;
        }
        /* Don't transition animations */
        .animate-spin, .spinner { transition: none !important; }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.7); }
        html.dark ::-webkit-scrollbar-thumb { background: rgba(100,130,230,.25); }
        html.dark ::-webkit-scrollbar-thumb:hover { background: rgba(100,130,230,.45); }

        /* ===== SPINNER ===== */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: inline-block;
            flex-shrink: 0;
        }

        /* ===== FOCUS RING OVERRIDE DARK ===== */
        html.dark .focus\:ring-amber-400:focus { --tw-ring-color: rgba(251,191,36,.5) !important; }

        /* ===== MISC ===== */
        textarea { font-family: inherit; }
        select { appearance: auto; }

        /* ===== KEYFRAMES ===== */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideIn { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Dark mode toggle button / sidebar footer item — flat by default,
           raised on hover, matching the sidebar nav item states. */
        .dark-toggle {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px; border-radius: 8px; width: 100%;
            font-size: 14px; font-weight: 500; cursor: pointer;
            background: var(--surface); border: none;
            color: var(--body);
            transition: box-shadow .2s ease, color .2s ease;
        }
        .dark-toggle:hover { box-shadow: var(--shadow-sm); color: var(--heading); }
        .dark-toggle:active { box-shadow: var(--shadow-inset); }

        /* Button group wrapper — strips individual shadows/radius from child
           buttons so only the wrapper reads as elevated, per button-group.md. */
        .neu-button-group {
            display: inline-flex;
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .neu-button-group > button {
            box-shadow: none !important;
            border-radius: 0 !important;
            margin-left: -1px;
        }
        .neu-button-group > button:first-child { margin-left: 0; }

        /* Tag / pill default */
        .pill {
            display: inline-flex; align-items: center;
            padding: 2px 10px; border-radius: 9999px;
            font-size: 12px; font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="wadii.js"></script>
</body>
</html>
